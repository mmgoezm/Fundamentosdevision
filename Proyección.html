<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cámara 3D - ITM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: white; }
        #app { display: flex; height: 100vh; width: 100vw; }
        #left-view { flex: 1; position: relative; border-right: 2px solid #333; }
        
        /* Contenedor fijo para la cámara */
        #right-view-container { 
            flex: 1; 
            position: relative; 
            background: #050505; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 10px;
            overflow: hidden;
        }
        #canvas-wrapper { 
            position: relative; 
            box-shadow: 0 0 30px rgba(0, 50, 160, 0.4); /* Sombra azul ITM */
            background-color: black;
        }
        
        /* Regla de pixeles */
        #ruler-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .ruler-line { stroke: #00ff00; stroke-width: 1.5; stroke-dasharray: 4; }
        .ruler-text { fill: #00ff00; font-family: monospace; font-size: 14px; font-weight: bold; user-select: none; text-shadow: 1px 1px 2px black; }
    </style>
    <!-- Importar Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <!-- VISTA GENERAL (Izquierda) -->
        <div id="left-view">
            <div class="absolute top-4 left-4 bg-black/80 text-white px-3 py-2 rounded text-sm pointer-events-none z-10 border border-gray-600 shadow-lg">
                <span class="font-bold text-yellow-400">Tamaño de Cuadrícula:</span><br>
                20x20 unidades (1 unidad = 1 metro)
            </div>
        </div>

        <!-- VISTA DE LA CÁMARA (Derecha) -->
        <div id="right-view-container">
            <!-- El wrapper mantendrá el tamaño fijo en pantalla -->
            <div id="canvas-wrapper">
                <canvas id="camera-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
                <!-- SVG superpuesto exacto sobre el canvas -->
                <svg id="ruler-svg"></svg>
            </div>
        </div>
    </div>

    <!-- PANEL DE CONTROLES FLOTANTE -->
    <div class="absolute top-4 right-4 w-80 bg-gray-900/95 p-4 rounded-lg shadow-lg border border-gray-700 z-10 flex flex-col gap-4 text-sm max-h-[90vh] overflow-y-auto">
        <h2 class="text-lg font-bold text-blue-400">Controles de Cámara</h2>
        
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-gray-400 text-xs mb-1">Resolución Ancho (px)</label>
                <input type="number" id="res-x" value="1280" class="w-full bg-gray-800 text-white rounded px-2 py-1 border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-gray-400 text-xs mb-1">Resolución Alto (px)</label>
                <input type="number" id="res-y" value="720" class="w-full bg-gray-800 text-white rounded px-2 py-1 border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <div>
            <label class="block text-gray-400 text-xs flex justify-between mb-1">
                <span>Foco (Distancia Focal)</span>
                <span id="focal-val" class="text-blue-300 font-bold">35 mm</span>
            </label>
            <input type="range" id="focal-length" min="10" max="200" value="35" class="w-full accent-blue-500">
        </div>

        <div class="space-y-1">
            <h3 class="text-gray-300 font-semibold mb-1">Posición de la Cámara</h3>
            <div class="flex gap-2">
                <label class="flex items-center gap-1"><span class="text-red-400 font-bold">X:</span> <input type="number" id="cam-x" value="0" step="0.5" class="w-16 bg-gray-800 rounded px-1 border border-gray-600"></label>
                <label class="flex items-center gap-1"><span class="text-green-400 font-bold">Y:</span> <input type="number" id="cam-y" value="1.5" step="0.5" class="w-16 bg-gray-800 rounded px-1 border border-gray-600"></label>
                <label class="flex items-center gap-1"><span class="text-blue-400 font-bold">Z:</span> <input type="number" id="cam-z" value="10" step="0.5" class="w-16 bg-gray-800 rounded px-1 border border-gray-600"></label>
            </div>
        </div>

        <hr class="border-gray-700">
        
        <button id="btn-objects" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded transition font-semibold shadow-md">
            Gestionar Objetos de Escena
        </button>
        <button id="btn-ruler" class="w-full bg-green-700 hover:bg-green-600 text-white py-2 rounded transition font-semibold shadow-md">
            Activar Regla (Medir Píxeles)
        </button>
    </div>

    <!-- MODAL DE OBJETOS EMERGENTE -->
    <div id="objects-modal" class="hidden fixed inset-0 bg-black/80 flex justify-center items-center z-50">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-lg w-96 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-blue-400">Propiedades de Objetos</h2>
                <button id="btn-close-modal" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-400 mb-1 text-sm">Seleccionar Objeto</label>
                <select id="obj-select" class="w-full bg-gray-800 text-white rounded px-3 py-2 border border-gray-600 focus:outline-none focus:border-blue-500">
                    <option value="cube">Cubo Base</option>
                    <option value="cylinder">Cilindro Base</option>
                    <option value="cone">Cono Base</option>
                    <option value="letraI">Letra I (ITM Institucional)</option>
                    <option value="letraT">Letra T (ITM Institucional)</option>
                    <option value="letraM">Letra M (ITM Institucional)</option>
                </select>
            </div>

            <div class="mb-4 p-3 bg-gray-800 rounded border border-gray-700 shadow-inner">
                <h4 class="text-xs text-gray-400 mb-1 uppercase tracking-wider">Dimensiones Físicas</h4>
                <p id="obj-dimensions" class="text-green-400 font-mono text-sm font-bold leading-tight">Ancho: -- <br> Alto: -- <br> Prof: --</p>
            </div>

            <div class="space-y-4">
                <div>
                    <h3 class="text-gray-300 font-semibold mb-2 text-sm">Posición Espacial</h3>
                    <div class="flex justify-between gap-2">
                        <label class="flex items-center gap-1 text-sm"><span class="text-red-400 font-bold">X:</span> <input type="number" id="obj-pos-x" step="0.5" class="w-20 bg-gray-800 rounded px-2 py-1 border border-gray-600"></label>
                        <label class="flex items-center gap-1 text-sm"><span class="text-green-400 font-bold">Y:</span> <input type="number" id="obj-pos-y" step="0.5" class="w-20 bg-gray-800 rounded px-2 py-1 border border-gray-600"></label>
                        <label class="flex items-center gap-1 text-sm"><span class="text-blue-400 font-bold">Z:</span> <input type="number" id="obj-pos-z" step="0.5" class="w-20 bg-gray-800 rounded px-2 py-1 border border-gray-600"></label>
                    </div>
                </div>
                <div>
                    <h3 class="text-gray-300 font-semibold mb-2 text-sm">Tamaño (Multiplicador de Escala)</h3>
                    <input type="number" id="obj-scale" step="0.1" min="0.1" value="1" class="w-full bg-gray-800 rounded px-3 py-2 border border-gray-600">
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Variables del DOM
        const leftView = document.getElementById('left-view');
        const rightContainer = document.getElementById('right-view-container');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const cameraCanvas = document.getElementById('camera-canvas');
        
        // Controles UI
        const resXInput = document.getElementById('res-x');
        const resYInput = document.getElementById('res-y');
        const focalInput = document.getElementById('focal-length');
        const focalValDisplay = document.getElementById('focal-val');
        const camX = document.getElementById('cam-x');
        const camY = document.getElementById('cam-y');
        const camZ = document.getElementById('cam-z');

        // Objetos Modal
        const btnObjects = document.getElementById('btn-objects');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const objectsModal = document.getElementById('objects-modal');
        const objSelect = document.getElementById('obj-select');
        const objPosX = document.getElementById('obj-pos-x');
        const objPosY = document.getElementById('obj-pos-y');
        const objPosZ = document.getElementById('obj-pos-z');
        const objScale = document.getElementById('obj-scale');
        const objDimensionsDisplay = document.getElementById('obj-dimensions');

        // Regla
        const btnRuler = document.getElementById('btn-ruler');
        const rulerSvg = document.getElementById('ruler-svg');
        let rulerActive = false;
        let rulerStart = null;
        let rulerElement = null;
        let rulerTextElement = null;

        // --- 1. CONFIGURACIÓN DE LA ESCENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const gridHelper = new THREE.GridHelper(20, 20, 0x555555, 0x222222);
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(3);
        scene.add(axesHelper);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // --- 2. GESTIÓN DE OBJETOS ---
        const colorITM = 0x0032A0; // Azul Institucional
        const matITM = new THREE.MeshStandardMaterial({ color: colorITM });
        const extrudeSettings = { depth: 0.2, bevelEnabled: false };

        // Creación Vectorial de la Letra I
        const shapeI = new THREE.Shape();
        shapeI.moveTo(-0.15, 0); shapeI.lineTo(-0.15, 1); shapeI.lineTo(0.15, 1); shapeI.lineTo(0.15, 0); shapeI.closePath();
        const geoI = new THREE.ExtrudeGeometry(shapeI, extrudeSettings);
        geoI.translate(0, -0.5, -0.1); 

        // Creación Vectorial de la Letra T
        const shapeT = new THREE.Shape();
        shapeT.moveTo(-0.15, 0); shapeT.lineTo(-0.15, 0.8); shapeT.lineTo(-0.4, 0.8); shapeT.lineTo(-0.4, 1); shapeT.lineTo(0.4, 1); shapeT.lineTo(0.4, 0.8); shapeT.lineTo(0.15, 0.8); shapeT.lineTo(0.15, 0); shapeT.closePath();
        const geoT = new THREE.ExtrudeGeometry(shapeT, extrudeSettings);
        geoT.translate(0, -0.5, -0.1);

        // Creación Vectorial de la Letra M
        const shapeM = new THREE.Shape();
        shapeM.moveTo(-0.5, 0); shapeM.lineTo(-0.5, 1); shapeM.lineTo(-0.2, 1); shapeM.lineTo(0, 0.4); shapeM.lineTo(0.2, 1); shapeM.lineTo(0.5, 1); shapeM.lineTo(0.5, 0); shapeM.lineTo(0.25, 0); shapeM.lineTo(0.25, 0.7); shapeM.lineTo(0, 0.2); shapeM.lineTo(-0.25, 0.7); shapeM.lineTo(-0.25, 0); shapeM.closePath();
        const geoM = new THREE.ExtrudeGeometry(shapeM, extrudeSettings);
        geoM.translate(0, -0.5, -0.1);

        const meshes = {
            cube: new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xef476f })),
            cylinder: new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1, 32), new THREE.MeshStandardMaterial({ color: 0x06d6a0 })),
            cone: new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 32), new THREE.MeshStandardMaterial({ color: 0x118ab2 })),
            letraI: new THREE.Mesh(geoI, matITM),
            letraT: new THREE.Mesh(geoT, matITM),
            letraM: new THREE.Mesh(geoM, matITM)
        };

        // Ubicación Inicial
        meshes.cube.position.set(-3, 0.5, 0);
        meshes.cylinder.position.set(0, 0.5, 0);
        meshes.cone.position.set(3, 0.5, 0);
        
        meshes.letraI.position.set(-2, 0.5, -3);
        meshes.letraT.position.set(0, 0.5, -3);
        meshes.letraM.position.set(2, 0.5, -3);

        Object.values(meshes).forEach(mesh => scene.add(mesh));

        // --- 3. CÁMARAS Y RENDERIZADORES ---
        
        const globalCamera = new THREE.PerspectiveCamera(50, leftView.clientWidth / leftView.clientHeight, 0.1, 100);
        globalCamera.position.set(10, 8, 10);
        const globalRenderer = new THREE.WebGLRenderer({ antialias: true });
        globalRenderer.setSize(leftView.clientWidth, leftView.clientHeight);
        leftView.appendChild(globalRenderer.domElement);
        const orbitControls = new OrbitControls(globalCamera, globalRenderer.domElement);
        orbitControls.target.set(0, 0, 0);

        let customResX = parseInt(resXInput.value);
        let customResY = parseInt(resYInput.value);
        
        const customCamera = new THREE.PerspectiveCamera(35, customResX / customResY, 0.1, 1000);
        customCamera.position.set(0, 1.5, 10);
        const customRenderer = new THREE.WebGLRenderer({ canvas: cameraCanvas, antialias: true, preserveDrawingBuffer: true });
        
        customRenderer.setSize(customResX, customResY, false); 
        
        const cameraHelper = new THREE.CameraHelper(customCamera);
        scene.add(cameraHelper);

        // --- 4. LÓGICA DE CONTENEDORES Y ACTUALIZACIÓN ---
        
        function adjustWrapperSize() {
            const containerRect = rightContainer.getBoundingClientRect();
            const containerAspect = containerRect.width / containerRect.height;
            const canvasAspect = customResX / customResY;

            if (canvasAspect > containerAspect) {
                canvasWrapper.style.width = '100%';
                canvasWrapper.style.height = `${containerRect.width / canvasAspect}px`;
            } else {
                canvasWrapper.style.height = '100%';
                canvasWrapper.style.width = `${containerRect.height * canvasAspect}px`;
            }
        }

        // NUEVO: Función para desactivar la regla y limpiar el SVG
        function deactivateRuler() {
            if (!rulerActive) return;
            rulerActive = false;
            rulerSvg.style.pointerEvents = 'none';
            rulerSvg.style.cursor = 'default';
            btnRuler.innerText = "Activar Regla (Medir Píxeles)";
            btnRuler.classList.replace('bg-red-600', 'bg-green-700');
            rulerSvg.innerHTML = ''; 
            rulerStart = null;
        }

        function updateCustomCamera() {
            // Desactiva la regla si el usuario cambia resolución o distancia focal
            deactivateRuler(); 

            customResX = parseInt(resXInput.value);
            customResY = parseInt(resYInput.value);
            
            customCamera.aspect = customResX / customResY;
            customCamera.setFocalLength(parseInt(focalInput.value));
            customCamera.position.set(parseFloat(camX.value), parseFloat(camY.value), parseFloat(camZ.value));
            customCamera.lookAt(0, 0, 0);
            customCamera.updateProjectionMatrix();
            cameraHelper.update();

            customRenderer.setSize(customResX, customResY, false);
            adjustWrapperSize();
        }

        function updateObjectDimensionsText(objId, scale) {
            const mesh = meshes[objId];
            mesh.geometry.computeBoundingBox();
            const bbox = mesh.geometry.boundingBox;
            
            const w = ((bbox.max.x - bbox.min.x) * scale).toFixed(2);
            const h = ((bbox.max.y - bbox.min.y) * scale).toFixed(2);
            const d = ((bbox.max.z - bbox.min.z) * scale).toFixed(2);

            objDimensionsDisplay.innerHTML = `Ancho: <span class="text-white">${w}m</span> <br> Alto: <span class="text-white">${h}m</span> <br> Prof: <span class="text-white">${d}m</span>`;
        }

        function loadObjectData() {
            const objId = objSelect.value;
            const mesh = meshes[objId];
            objPosX.value = mesh.position.x;
            objPosY.value = mesh.position.y;
            objPosZ.value = mesh.position.z;
            objScale.value = mesh.scale.x; 
            updateObjectDimensionsText(objId, mesh.scale.x);
        }

        function applyObjectData() {
            const objId = objSelect.value;
            const mesh = meshes[objId];
            mesh.position.set(parseFloat(objPosX.value), parseFloat(objPosY.value), parseFloat(objPosZ.value));
            const s = parseFloat(objScale.value);
            mesh.scale.set(s, s, s);
            updateObjectDimensionsText(objId, s);
        }

        // --- 5. EVENTOS ---
        resXInput.addEventListener('change', updateCustomCamera);
        resYInput.addEventListener('change', updateCustomCamera);
        camX.addEventListener('change', updateCustomCamera);
        camY.addEventListener('change', updateCustomCamera);
        camZ.addEventListener('change', updateCustomCamera);
        focalInput.addEventListener('input', (e) => {
            focalValDisplay.innerText = `${e.target.value} mm`;
            updateCustomCamera();
        });

        btnObjects.addEventListener('click', () => { 
            loadObjectData(); 
            objectsModal.classList.remove('hidden'); 
        });
        
        btnCloseModal.addEventListener('click', () => {
            objectsModal.classList.add('hidden'); 
        });

        objSelect.addEventListener('change', loadObjectData);
        [objPosX, objPosY, objPosZ, objScale].forEach(el => el.addEventListener('input', applyObjectData));

        window.addEventListener('resize', () => {
            globalCamera.aspect = leftView.clientWidth / leftView.clientHeight;
            globalCamera.updateProjectionMatrix();
            globalRenderer.setSize(leftView.clientWidth, leftView.clientHeight);
            adjustWrapperSize();
        });

        updateCustomCamera();

        // --- 6. EVENTOS DE LA REGLA ---
        btnRuler.addEventListener('click', () => {
            if (rulerActive) {
                deactivateRuler();
            } else {
                rulerActive = true;
                rulerSvg.style.pointerEvents = 'auto';
                rulerSvg.style.cursor = 'crosshair';
                btnRuler.innerText = "Desactivar Regla";
                btnRuler.classList.replace('bg-green-700', 'bg-red-600');
            }
        });

        rulerSvg.addEventListener('mousedown', (e) => {
            if (!rulerActive) return;
            const rect = rulerSvg.getBoundingClientRect();
            rulerStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            rulerSvg.innerHTML = ''; 
            
            rulerElement = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            rulerElement.setAttribute('class', 'ruler-line');
            rulerSvg.appendChild(rulerElement);

            rulerTextElement = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            rulerTextElement.setAttribute('class', 'ruler-text');
            rulerSvg.appendChild(rulerTextElement);
        });

        rulerSvg.addEventListener('mousemove', (e) => {
            if (!rulerActive || !rulerStart || !rulerElement) return;
            const rect = rulerSvg.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            rulerElement.setAttribute('x1', rulerStart.x);
            rulerElement.setAttribute('y1', rulerStart.y);
            rulerElement.setAttribute('x2', currentX);
            rulerElement.setAttribute('y2', currentY);

            const dx = currentX - rulerStart.x;
            const dy = currentY - rulerStart.y;
            const distCss = Math.sqrt(dx*dx + dy*dy);

            const factorEscala = customResX / rect.width;
            const distResolucionReal = (distCss * factorEscala).toFixed(1);

            rulerTextElement.setAttribute('x', currentX + 15);
            rulerTextElement.setAttribute('y', currentY + 15);
            rulerTextElement.textContent = `${distResolucionReal} px`;
        });

        rulerSvg.addEventListener('mouseup', () => rulerStart = null);
        rulerSvg.addEventListener('mouseleave', () => rulerStart = null);

        // --- 7. BUCLE DE ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            globalRenderer.render(scene, globalCamera);
            customRenderer.render(scene, customCamera);
        }
        animate();
    </script>
</body>
</html>
